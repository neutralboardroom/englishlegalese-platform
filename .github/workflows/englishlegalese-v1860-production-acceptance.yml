name: EnglishLegalese v1.86.0 Public Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-acceptance:
    if: startsWith(github.event.head_commit.message, 'EnglishLegalese v1.86.0 ')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and audit security
        run: npm install --ignore-scripts --no-fund && npm run audit:high
      - name: Verify pinned installed Chromium and WebKit binaries
        run: |
          node -e "const fs=require('fs'); const {chromium,webkit}=require('@playwright/test'); for(const browser of [chromium,webkit]) { const executable=browser.executablePath(); if(!fs.existsSync(executable)) { console.error('Required browser missing: '+executable); process.exitCode=1; } }"
      - name: Wait for actual public apex and www exact release
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 55); do
            a="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            b="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://www.englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            page="$(curl -fsSL --max-time 15 "https://englishlegalese.com/learn/legal-english-program/?check=${GITHUB_SHA}" || true)"
            if grep -q '1.86.0' <<<"$a" && grep -q '1.86.0' <<<"$b" && grep -q 'v1860-business-cards' <<<"$page"; then exit 0; fi
            sleep 10
          done
          echo 'Public hosts did not converge to required release' >&2
          exit 1
      - name: Run exact v1.86.0 public browser acceptance on apex and www
        run: npx playwright test tests/v1860-production.spec.js --config=playwright.production.config.js
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishlegalese-v1860-public
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
