name: EnglishLegalese One-Shot OpenAI Credential Smoke Test
on:
  push:
    branches:
      - verification/ai-credential-one-shot-2026-10-20
permissions:
  contents: read
jobs:
  verify-one-short-openai-response:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one fictional authenticated SmartTeacher probe (no retries, no secrets in logs)
        shell: bash
        run: |
          node <<'NODE'
          const {randomBytes}=require('node:crypto');
          const base='https://englishlegalese.com';
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),45000);
          async function post(path,body,token){
            const headers={'content-type':'application/json'};
            if(token)headers.authorization='Bearer '+token;
            const response=await fetch(base+path,{method:'POST',headers,body:JSON.stringify(body),signal:controller.signal});
            let json;try{json=await response.json()}catch{json={};}
            return {status:response.status,ok:response.ok,json};
          }
          (async()=>{
            const key=randomBytes(12).toString('hex');
            const email='el-smoke-'+key+'@example.invalid';
            const registered=await post('/api/v119/auth/register',{
              email,password:randomBytes(24).toString('hex'),full_name:'Synthetic SmartTeacher Smoke Test',role:'student'
            });
            if(!registered.ok||!registered.json?.token)throw new Error('Synthetic student registration failed HTTP '+registered.status);
            console.log('Synthetic student registered; credentials and token hidden');
            const reply=await post('/api/v119/smartteacher',{
              mode:'student_tutor',
              prompt:'Fictional practice only: reply with the single word READY.',
              context:{}
            },registered.json.token);
            if(!reply.ok){
              const err=String(reply.json?.error||'').toLowerCase();
              const reason=err.includes('quota')?'QUOTA_EXCEEDED':err.includes('model')?'MODEL_ACCESS_OR_NAME':err.includes('api key')||err.includes('authentication')?'AUTHENTICATION':err.includes('rate')?'RATE_LIMIT':'OTHER';
              console.log('One authorized SmartTeacher test failed HTTP '+reply.status+' category='+reason);
              process.exitCode=1;return;
            }
            const i=reply.json?.interaction||{};
            const p=String(i.configured_provider||'');
            const valid=p==='openai_chatgpt_responses_api_only'&&String(i.output||'').trim().length>0;
            console.log('OpenAI-backed SmartTeacher API HTTP '+reply.status+'; provider='+p+'; nonempty_response='+Boolean(String(i.output||'').trim())+'; answer_characters='+String(i.output||'').length);
            if(!valid)process.exitCode=1;
          })().catch(err=>{console.log('TEST ERROR '+(err?.name||'Error'));process.exitCode=1;}).finally(()=>clearTimeout(timeout));
          NODE
