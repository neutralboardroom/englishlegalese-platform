name: EnglishLegalese Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full release lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact declared production dependency set
        run: npm install --ignore-scripts --no-fund

      - name: Block high and critical dependency vulnerabilities
        run: npm run audit:high

      - name: Run syntax, regression, rule and no-drift gates
        run: npm run check
