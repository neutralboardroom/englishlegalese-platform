name: EnglishLegalese v1.81.0 Production Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-acceptance:
    if: startsWith(github.event.head_commit.message, 'EnglishLegalese v1.81.0 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-fund
      - name: Block high and critical dependency vulnerabilities
        run: npm run audit:high
      - name: Install Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for real v1.81.0 production HTML and public JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            health="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/health?acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            asset="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/product-v1810.js?v=1.81.0&acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            curriculum="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/curriculum-v1800-data.js?v=1.80.0&acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            catalog="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/product-v1800-catalog.js?v=1.80.0&acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -q '1.81.0' <<<"$health" && grep -q 'englishlegaleseMaterialRelease' <<<"$asset" && grep -q 'class-28' <<<"$curriculum" && grep -q 'v1800-class-catalog' <<<"$catalog"; then
              echo "v1.81.0 health, private study planner, all 28 class records and lesson/exercise JS confirmed live."
              exit 0
            fi
            echo "Production not yet converged ${attempt}/48."
            sleep 10
          done
          echo 'New production version not verified in eight minutes'
          exit 1
      - name: Run real apex and www desktop tablet mobile acceptance
        env:
          PRODUCTION_BASE_URL: https://englishlegalese.com
        run: npm run e2e:production
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishlegalese-v1810-production-acceptance
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
