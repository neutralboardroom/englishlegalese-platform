name: EnglishLegalese v1.73.0 Production Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-acceptance:
    if: startsWith(github.event.head_commit.message, 'EnglishLegalese v1.73.0 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact declared dependency set
        run: npm install --ignore-scripts --no-fund
      - name: Block high and critical dependency vulnerabilities
        run: npm run audit:high
      - name: Install Playwright Chromium and WebKit for actual desktop/mobile/tablet projects
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for Render exact v1.73.0 production rollout
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            health="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/health?acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            asset="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/product-v1590.js?v=1.73.0&acceptance=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -q '1.73.0-navigation-domain-hardening' <<<"$health" && grep -q "const VERSION='1.73.0'" <<<"$asset"; then
              echo "Exact v1.73.0 runtime and public recovery asset are live."
              exit 0
            fi
            echo "Production still unconfirmed from fresh-cache-check ${attempt}/36."
            sleep 10
          done
          echo "Production did not converge to v1.73.0 within six minutes."
          exit 1
      - name: Run real production desktop tablet mobile acceptance
        env:
          PRODUCTION_BASE_URL: https://englishlegalese.com
        run: npx playwright test --config=playwright.production.config.js
      - name: Preserve production screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishlegalese-v1730-production-acceptance
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
