name: EnglishLegalese v1.85.1 Public Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-acceptance:
    if: startsWith(github.event.head_commit.message, 'EnglishLegalese v1.85.1 ')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and audit security
        run: npm install --ignore-scripts --no-fund && npm run audit:high
      - name: Verify pinned installed Chromium and WebKit binaries
        run: |
          node -e "const fs=require('fs'); const {chromium,webkit}=require('@playwright/test'); for(const browser of [chromium,webkit]) { const executable=browser.executablePath(); if(!fs.existsSync(executable)) { console.error('Required browser missing: '+executable); process.exitCode=1; } }"
      - name: Wait for actual public apex and www exact release
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 55); do
            a="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            b="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://www.englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            page="$(curl -fsSL --max-time 15 "https://englishlegalese.com/learn/business-english/?check=${GITHUB_SHA}" || true)"
            legal="$(curl -fsSL --max-time 15 "https://englishlegalese.com/learn/legal-english/?check=${GITHUB_SHA}" || true)"
            if grep -q '1.85.1' <<<"$a" && grep -q '1.85.1' <<<"$b" && grep -Fq "\"git_commit\":\"$GITHUB_SHA\"" <<<"$a" && grep -Fq "\"git_commit\":\"$GITHUB_SHA\"" <<<"$b" && grep -q 'v1860-business-program' <<<"$page" && grep -q 'v1860-legal-catalog' <<<"$legal" && grep -q 'v1870-learning-modes' <<<"$legal" && grep -q 'v1870-learning-modes' <<<"$page"; then exit 0; fi
            sleep 10
          done
          echo 'Public hosts did not converge to required release' >&2
          exit 1
      - name: Fail closed unless HF4 workbooks and topic inquiries are collected on all devices
        shell: bash
        run: |
          set -euo pipefail
          collected="$(npx playwright test tests/v1870-production.spec.js --config=playwright.production.config.js --list)"
          printf '%s\n' "$collected"
          count="$(printf '%s\n' "$collected" | sed -n 's/.*Total: \([0-9][0-9]*\) tests in .*/\1/p' | tail -1)"
          if [[ -z "$count" || "$count" -lt 18 ]]; then
            echo "BLOCK: v1870 HF4 requires at least 18 independent public test cases across apex/www, desktop/tablet/mobile; collected ${count:-0}" >&2
            exit 1
          fi
      - name: Run v1.85.1 pages, legal/business nav, workbooks and topic inquiries on both public hosts
        run: npx playwright test tests/v1850-production.spec.js tests/v1850-followthrough-production.spec.js tests/v1860-production.spec.js tests/v1870-production.spec.js --config=playwright.production.config.js
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishlegalese-v1850-public
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
