name: EnglishLegalese v1.85.0 Public Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-acceptance:
    if: startsWith(github.event.head_commit.message, 'EnglishLegalese v1.85.0 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and audit security
        run: npm install --ignore-scripts --no-fund && npm run audit:high
      - name: Install desktop/tablet/mobile browser
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for actual public apex and www exact release
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 55); do
            a="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            b="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://www.englishlegalese.com/health?commit=${GITHUB_SHA}&try=$i" || true)"
            page="$(curl -fsSL --max-time 15 "https://englishlegalese.com/learn/business-english/?check=${GITHUB_SHA}" || true)"
            if grep -q '1.85.0' <<<"$a" && grep -q '1.85.0' <<<"$b" && grep -q 'v1850-business-cards' <<<"$page"; then exit 0; fi
            sleep 10
          done
          echo 'Public hosts did not converge to required release' >&2
          exit 1
      - name: Run exact v1.85.0 public browser acceptance on apex and www
        run: npx playwright test tests/v1850-production.spec.js --config=playwright.production.config.js
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishlegalese-v1850-public
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
